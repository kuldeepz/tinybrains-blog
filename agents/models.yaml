# Model plan per agent role.
#   free:  OpenRouter FREE models only, tried in order (OpenRouter falls through the list).
#   azure: Azure OpenAI tier used for paid calls:
#            mini      -> GEMINI_DEPLOYMENT            (e.g. your gpt-5-mini deployment)
#            architect -> GEMINI_DEPLOYMENT_ARCHITECT  (your strongest model; falls back to mini)
#            small     -> GEMINI_DEPLOYMENT_SMALL      (falls back to mini)
#   reasoning_effort: low|medium|high, sent to Azure reasoning models only (ignored if unsupported).
#   prefer_paid: in Senior/Mini mode use Azure first (free models become the fallback).
# Every /write asks you in Telegram: 🏛 Senior / 💡 Mini / 🆓 Free. Nothing on Azure runs without your tap.
# Overrides (GitHub repo Variables): MODEL_<ROLE>_FREE="a:free,b:free"   MODEL_<ROLE>_AZURE="mini|architect|small"
defaults:
  temperature: 0.4
  max_tokens: 8000
roles:
  architect:             # Senior mode only: writes the per-post senior brief
    free: []
    azure: architect
    prefer_paid: true
    max_tokens: 32000    # room for hidden reasoning (e.g. GPT-6.1 Sol) + the brief itself
    reasoning_effort: high
  head:
    free: [baidu/ernie-5.5-flash-preview:free, nvidia/nemotron-3.5-super-vl:free]
    azure: small
  pm:
    free: [baidu/ernie-5.5-flash-preview:free, nvidia/nemotron-3.5-super-vl:free]
    azure: small
  researcher:
    free: [baidu/ernie-5.5-flash-preview:free, nvidia/nemotron-3.5-super-vl:free]
    azure: mini
    prefer_paid: true
    web: true            # OpenRouter web search on free models is billed per search (~$0.02/post); Azure has no web plugin
    max_tokens: 6000
  writer:
    free: [nvidia/nemotron-3-ultra-550b-a55b:free, baidu/ernie-5.5-flash-preview:free]
    azure: mini
    prefer_paid: true
    temperature: 0.6
    max_tokens: 16000
  editor:
    free: [nvidia/nemotron-3-ultra-550b-a55b:free, baidu/ernie-5.5-flash-preview:free]
    azure: mini
    prefer_paid: true
    max_tokens: 16000
  designer:
    free: [baidu/ernie-5.5-flash-preview:free, nvidia/nemotron-3-ultra-550b-a55b:free]
    azure: mini
    prefer_paid: true
    max_tokens: 16000
  reviewer:              # Senior: strongest Azure model reviews. Mini/Free: a different model family (Gemma) reviews.
    free: [google/gemma-4-31b-it:free, nvidia/nemotron-3.5-super-vl:free]
    azure: architect
    prefer_paid_in: [senior]
    temperature: 0.1
    max_tokens: 20000    # reasoning + rubric JSON
    reasoning_effort: medium
  tester:
    free: [google/gemma-4-26b-a4b-it:free, google/gemma-4-31b-it:free, baidu/ernie-5.5-flash-preview:free]
    azure: small
    temperature: 0.0
    max_tokens: 16000
  router:
    free: [google/gemma-4-26b-a4b-it:free, google/gemma-4-31b-it:free, baidu/ernie-5.5-flash-preview:free]
    azure: small
    temperature: 0.0
    max_tokens: 800
  vision:
    free: [nvidia/nemotron-3.5-super-vl:free, google/gemma-4-31b-it:free]
    azure: small
    max_tokens: 3000
