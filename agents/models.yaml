# Model plan per agent role.
#   free: OpenRouter free models, tried in order (OpenRouter falls through the list automatically)
#   paid: OpenRouter paid model used ONLY after you approve it in Telegram (once per run)
#   azure: Azure OpenAI tier ("large" -> AZURE_OPENAI_DEPLOYMENT, "small" -> AZURE_OPENAI_DEPLOYMENT_SMALL); also paid, also needs approval
# Overrides (GitHub repo Variables): MODEL_<ROLE>_FREE="a:free,b:free"  MODEL_<ROLE>_PAID="vendor/model"
defaults:
  temperature: 0.4
  max_tokens: 8000
roles:
  head:
    free: [baidu/ernie-5.5-flash-preview:free, nvidia/nemotron-3.5-super-vl:free]
    paid: anthropic/claude-sonnet-5.5
    azure: large
  pm:
    free: [baidu/ernie-5.5-flash-preview:free, nvidia/nemotron-3.5-super-vl:free]
    paid: anthropic/claude-sonnet-5.5
    azure: large
  researcher:
    free: [baidu/ernie-5.5-flash-preview:free, nvidia/nemotron-3.5-super-vl:free]
    paid: anthropic/claude-sonnet-5.5
    azure: large
    web: true            # OpenRouter web search is billed per search even on free models (~$0.02/post)
    max_tokens: 6000
  writer:
    free: [nvidia/nemotron-3-ultra-550b-a55b:free, baidu/ernie-5.5-flash-preview:free]
    paid: anthropic/claude-opus-5.5
    azure: large
    temperature: 0.6
    max_tokens: 12000
  editor:
    free: [nvidia/nemotron-3-ultra-550b-a55b:free, baidu/ernie-5.5-flash-preview:free]
    paid: anthropic/claude-sonnet-5.5
    azure: large
    max_tokens: 12000
  designer:
    free: [baidu/ernie-5.5-flash-preview:free, nvidia/nemotron-3-ultra-550b-a55b:free]
    paid: anthropic/claude-sonnet-5.5
    azure: large
    max_tokens: 12000
  reviewer:              # different model family from the writer = independent review
    free: [google/gemma-4-31b-it:free, nvidia/nemotron-3.5-super-vl:free]
    paid: openai/gpt-5.6-terra
    azure: large
    temperature: 0.1
  tester:
    free: [google/gemma-4-26b-a4b-it:free, google/gemma-4-31b-it:free]
    paid: anthropic/claude-haiku-5.5
    azure: small
    temperature: 0.0
    max_tokens: 12000
  router:
    free: [google/gemma-4-26b-a4b-it:free, google/gemma-4-31b-it:free]
    paid: anthropic/claude-haiku-5.5
    azure: small
    temperature: 0.0
    max_tokens: 800
  vision:
    free: [nvidia/nemotron-3.5-super-vl:free, google/gemma-4-31b-it:free]
    paid: anthropic/claude-haiku-5.5
    azure: small
    max_tokens: 3000
