# Model per agent role. Primary = OpenRouter model id; fallback = Azure OpenAI tier
# ("large" -> AZURE_OPENAI_DEPLOYMENT, "small" -> AZURE_OPENAI_DEPLOYMENT_SMALL or the large one).
# Override any role at runtime with env var MODEL_<ROLE>, e.g. MODEL_WRITER=openai/gpt-5.6-sol
defaults:
  temperature: 0.4
  max_tokens: 8000
roles:
  head:      { model: anthropic/claude-sonnet-5.5, azure: large }
  pm:        { model: anthropic/claude-sonnet-5.5, azure: large }
  researcher: { model: anthropic/claude-sonnet-5.5, azure: large, web: true, max_tokens: 6000 }
  writer:    { model: anthropic/claude-opus-5.5,   azure: large, temperature: 0.6, max_tokens: 12000 }
  editor:    { model: anthropic/claude-sonnet-5.5, azure: large, max_tokens: 12000 }
  designer:  { model: anthropic/claude-sonnet-5.5, azure: large, max_tokens: 12000 }
  reviewer:  { model: openai/gpt-5.6-terra,        azure: large, temperature: 0.1 }   # different model family = independent review
  tester:    { model: anthropic/claude-haiku-5.5,  azure: small, temperature: 0.0, max_tokens: 12000 }
  router:    { model: anthropic/claude-haiku-5.5,  azure: small, temperature: 0.0, max_tokens: 800 }
  vision:    { model: anthropic/claude-haiku-5.5,  azure: small, max_tokens: 3000 }
