    <text x="158" y="332">791</text><text x="282" y="332">2010</text><text x="398" y="332">428</text><text x="524" y="332">3321</text>
    <text x="643" y="332">374</text><text x="719" y="332">264</text><text x="828" y="332">8199</text><text x="929" y="332">13</text>
