<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Geist Mono, ui-monospace, Menlo, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1"/></pattern>
    <radialGradient id="gv" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".5"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="gc" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity=".28"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A897FF"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#0B0C11"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="470" cy="300" r="330" fill="url(#gv)"/>
  <circle cx="820" cy="360" r="300" fill="url(#gc)"/>
  <text x="1150" y="54" fill="#8B92A3" font-size="18" text-anchor="end">agent/loop.py · while stop_reason == "tool_use"</text>
  <!-- loop ring -->
  <circle cx="600" cy="315" r="190" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-dasharray="10 12" opacity=".9"/>
  <path d="M 745 192 A 190 190 0 0 1 788 300" fill="none" stroke="#A897FF" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M 745 438 A 190 190 0 0 1 640 501" fill="none" stroke="#5EE3F5" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M 455 438 A 190 190 0 0 1 412 330" fill="none" stroke="#A897FF" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M 455 192 A 190 190 0 0 1 560 129" fill="none" stroke="#5EE3F5" stroke-width="3" marker-end="url(#ar)"/>
  <!-- nodes -->
  <g font-size="20" text-anchor="middle">
    <rect x="520" y="100" width="160" height="50" rx="12" fill="#0E1016" stroke="#7C5CFF" stroke-width="1.5"/>
    <text x="600" y="132" fill="#EDEEF2">model</text>
    <rect x="712" y="290" width="176" height="50" rx="12" fill="#0E1016" stroke="rgba(255,255,255,.22)"/>
    <text x="800" y="322" fill="#EDEEF2">tool_use</text>
    <rect x="520" y="480" width="160" height="50" rx="12" fill="#0E1016" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="600" y="512" fill="#EDEEF2">execute()</text>
    <rect x="300" y="290" width="196" height="50" rx="12" fill="#0E1016" stroke="rgba(255,255,255,.22)"/>
    <text x="398" y="322" fill="#EDEEF2">tool_result</text>
  </g>
  <!-- center -->
  <circle cx="600" cy="315" r="46" fill="#0A0B0F" stroke="url(#lg)" stroke-width="2"/>
  <text x="600" y="322" fill="#A897FF" font-size="22" text-anchor="middle">↻ n≤8</text>
  <!-- side transcript -->
  <g font-size="15" fill="#8B92A3">
    <text x="60" y="470"><tspan fill="#5EE3F5">$</tspan> python agent.py</text>
    <text x="60" y="496"><tspan fill="#B4A5FF">→</tspan> get_weather({"city":"Pune"})</text>
    <text x="60" y="522"><tspan fill="#4ADE80">✓</tspan> 31°C, clear</text>
    <text x="60" y="548"><tspan fill="#B4A5FF">→</tspan> end_turn · 2 steps</text>
  </g>
</svg>
