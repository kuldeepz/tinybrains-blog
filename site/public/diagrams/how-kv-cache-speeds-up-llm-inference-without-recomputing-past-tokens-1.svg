<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram showing how KV cache speeds up LLM inference by reusing past tokens during decode">
  <rect width="800" height="520" rx="24" fill="#0B0C10"/>
  <defs>
    <linearGradient id="g1" x1="120" y1="70" x2="680" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="g2" x1="120" y1="300" x2="680" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>

  <text x="400" y="44" text-anchor="middle" fill="#E6E8EE" font-family="Geist, ui-sans-serif, sans-serif" font-size="22" font-weight="700">
    KV cache turns repeated prefix work into reusable state
  </text>

  <rect x="70" y="90" width="180" height="90" rx="16" stroke="#7C5CFF" stroke-width="2" fill="#11131A"/>
  <text x="160" y="123" text-anchor="middle" fill="#E6E8EE" font-family="Geist, ui-sans-serif, sans-serif" font-size="16" font-weight="600">Prefill</text>
  <text x="160" y="148" text-anchor="middle" fill="#AAB0BE" font-family="Geist, ui-sans-serif, sans-serif" font-size="13">Process prompt once</text>
  <text x="160" y="168" text-anchor="middle" fill="#AAB0BE" font-family="Geist, ui-sans-serif, sans-serif" font-size="13">Build K and V cache</text>

  <rect x="310" y="90" width="180" height="90" rx="16" stroke="#22D3EE" stroke-width="2" fill="#11131A"/>
  <text x="400" y="123" text-anchor="middle" fill="#E6E8EE" font-family="Geist, ui-sans-serif, sans-serif" font-size="16" font-weight="600">Decode step 1</text>
  <text x="400" y="148" text-anchor="middle" fill="#AAB0BE" font-family="Geist, ui-sans-serif, sans-serif" font-size="13">Query the last token</text>
  <text x="400" y="168" text-anchor="middle" fill="#AAB0BE" font-family="Geist, ui-sans-serif, sans-serif" font-size="13">Attend over cached history</text>

  <rect x="550" y="90" width="180" height="90" rx="16" stroke="#7C5CFF" stroke-width="2" fill="#11131A"/>
  <text x="640" y="123" text-anchor="middle" fill="#E6E8EE" font-family="Geist, ui-sans-serif, sans-serif" font-size="16" font-weight="600">Decode step 2+</text>
  <text x="640" y="148" text-anchor="middle" fill="#AAB0BE" font-family="Geist, ui-sans-serif, sans-serif" font-size="13">Reuse past K and V</text>
  <text x="640" y="168" text-anchor="middle" fill="#AAB0BE" font-family="Geist, ui-sans-serif, sans-serif" font-size="13">Only new token is computed</text>

  <line x1="250" y1="135" x2="304" y2="135" stroke="url(#g1)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="304,135 294,129 294,141" fill="#22D3EE"/>
  <line x1="490" y1="135" x2="544" y2="135" stroke="url(#g2)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="544,135 534,129 534,141" fill="#7C5CFF"/>

  <rect x="70" y="250" width="620" height="180" rx="20" stroke="#2A2D3A" stroke-width="2" fill="#10131A"/>
  <text x="90" y="282" fill="#E6E8EE" font-family="Geist, ui-sans-serif, sans-serif" font-size="16" font-weight="700">What the cache stores</text>

  <rect x="110" y="315" width="150" height="72" rx="14" fill="#161926" stroke="#7C5CFF" stroke-width="2"/>
  <text x="185" y="345" text-anchor="middle" fill="#E6E8EE" font-family="Geist, ui-sans-serif, sans-serif" font-size="15" font-weight="600">Keys</text>
  <text x="185" y="367" text-anchor="middle" fill="#AAB0BE" font-family="Geist, ui-sans-serif, sans-serif" font-size="12">Reusable past state</text>

  <rect x="325" y="315" width="150" height="72" rx="14" fill="#161926" stroke="#22D3EE" stroke-width="2"/>
  <text x="400" y="345" text-anchor="middle" fill="#E6E8EE" font-family="Geist, ui-sans-serif, sans-serif" font-size="15" font-weight="600">Values</text>
  <text x="400" y="367" text-anchor="middle" fill="#AAB0BE" font-family="Geist, ui-sans-serif, sans-serif" font-size="12">Reusable past state</text>

  <rect x="540" y="315" width="110" height="72" rx="14" fill="#161926" stroke="#7C5CFF" stroke-width="2"/>
  <text x="595" y="345" text-anchor="middle" fill="#E6E8EE" font-family="Geist, ui-sans-serif, sans-serif" font-size="15" font-weight="600">Query</text>
  <text x="595" y="367" text-anchor="middle" fill="#AAB0BE" font-family="Geist, ui-sans-serif, sans-serif" font-size="12">Recomputed</text>

  <path d="M185 302V292C185 280 195 270 207 270H540C552 270 562 280 562 292V302" stroke="#2A2D3A" stroke-width="2"/>
  <path d="M400 302V292C400 280 410 270 422 270H540" stroke="#2A2D3A" stroke-width="2"/>

  <text x="400" y="462" text-anchor="middle" fill="#AAB0BE" font-family="Geist, ui-sans-serif, sans-serif" font-size="13">
    Prefill pays the full prompt cost once; decode reuses cached history for every new token
  </text>
</svg>