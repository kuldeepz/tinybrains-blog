name: CI
on:
  # Post PRs are opened by the bot after the agent run has already built the site with the post, and GitHub holds
  # bot-triggered PR runs for approval (they then fail on merge), so PRs that only add post files skip CI.
  pull_request:
    paths-ignore: ["site/src/content/posts/**", "site/public/covers/**", "site/public/diagrams/**"]
  push:
    branches: [main]
    paths: ["agents/**", "tests/**", "bot/**"]
permissions:
  contents: read
jobs:
  site:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci && npm run build
        working-directory: site
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agents/requirements.txt }
      - run: pip install -r agents/requirements.txt
      - run: python -m unittest discover -s tests -t . -v
