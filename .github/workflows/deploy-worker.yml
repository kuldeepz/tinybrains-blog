name: Deploy Telegram bot (Cloudflare Worker)
# Deploys bot/worker to Cloudflare and registers the Telegram webhook. No local tooling needed.
# Needs repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, BOT_GITHUB_PAT
on:
  push:
    branches: [main]
    paths: ["bot/worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-worker
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are configured
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PAT: ${{ secrets.BOT_GITHUB_PAT }}
        run: |
          if [ -z "$CF" ] || [ -z "$TG" ] || [ -z "$PAT" ]; then
            echo "::warning::Bot secrets not set yet - skipping deploy (see README 'Setup')."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: bot/worker/package-lock.json }
      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: npm ci
        working-directory: bot/worker
      - name: Generate webhook secret
        if: steps.check.outputs.ready == 'true'
        id: sec
        run: |
          S=$(openssl rand -hex 32)
          echo "::add-mask::$S"
          echo "value=$S" >> "$GITHUB_OUTPUT"
      - name: Ensure workers.dev subdomain exists
        if: steps.check.outputs.ready == 'true'
        id: sub
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/subdomain"
          SUB=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "$API" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            for CAND in tinybrains "tinybrains-$(openssl rand -hex 3)" "tinybrains-$(openssl rand -hex 4)"; do
              RES=$(curl -s -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
                    --data "{\"subdomain\":\"$CAND\"}" "$API")
              if [ "$(echo "$RES" | jq -r .success)" = "true" ]; then SUB="$CAND"; echo "Registered $SUB.workers.dev"; break; fi
              echo "Could not register $CAND: $(echo "$RES" | jq -c .errors)"
            done
          fi
          if [ -z "$SUB" ]; then
            echo "::error::No workers.dev subdomain. Open https://dash.cloudflare.com -> Workers & Pages, accept the free workers.dev subdomain, then re-run."
            exit 1
          fi
          echo "Using $SUB.workers.dev"
          echo "subdomain=$SUB" >> "$GITHUB_OUTPUT"
      - name: Deploy worker and set its secrets
        if: steps.check.outputs.ready == 'true'
        id: deploy
        working-directory: bot/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          S_HOOK: ${{ steps.sec.outputs.value }}
          S_PAT: ${{ secrets.BOT_GITHUB_PAT }}
          SUB: ${{ steps.sub.outputs.subdomain }}
        run: |
          set -euo pipefail
          npx wrangler deploy
          jq -n --arg a "$S_TG" --arg b "$S_CHAT" --arg c "$S_HOOK" --arg d "$S_PAT" \
            '{TELEGRAM_BOT_TOKEN:$a, TELEGRAM_CHAT_ID:$b, TELEGRAM_WEBHOOK_SECRET:$c, GITHUB_TOKEN:$d}' \
            > "$RUNNER_TEMP/secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
          NAME=$(grep -E '^name *=' wrangler.toml | sed -E 's/^name *= *"([^"]+)".*/\1/')
          URL="https://${NAME}.${SUB}.workers.dev"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # wait until the new worker answers (workers.dev routes can take a few seconds)
          for i in $(seq 1 12); do
            if curl -sf "$URL" | grep -q "tinybrains bot ok"; then echo "Worker live at $URL"; break; fi
            sleep 5
          done
      - name: Register Telegram webhook
        if: steps.check.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET: ${{ steps.sec.outputs.value }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          RES=$(curl -s "https://api.telegram.org/bot${TOKEN}/setWebhook" \
            --data-urlencode "url=${URL%/}/telegram" \
            --data-urlencode "secret_token=${SECRET}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]' \
            -d drop_pending_updates=true)
          echo "$RES" | grep -q '"ok":true' || { echo "::error::setWebhook failed: $(echo "$RES" | sed "s/${TOKEN}/***/g")"; exit 1; }
          echo "Webhook set to ${URL%/}/telegram"
          CMDS='[{"command":"help","description":"What I can do"},
                 {"command":"idea","description":"Store an idea only (no writing)"},
                 {"command":"ideas","description":"List stored ideas"},
                 {"command":"write","description":"Write now: topic or ids, e.g. T001 T002"},
                 {"command":"topics","description":"Covered vs pending topics"},
                 {"command":"status","description":"Progress summary"},
                 {"command":"drop","description":"Discard an idea, e.g. /drop T003"}]'
          curl -s "https://api.telegram.org/bot${TOKEN}/setMyCommands" --data-urlencode "commands=${CMDS}" | grep -q '"ok":true' \
            && echo "Command menu registered"
          curl -s "https://api.telegram.org/bot${TOKEN}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🧠 tinybrains bot deployed. Send /help" > /dev/null
